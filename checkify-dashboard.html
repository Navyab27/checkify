<title>Checkify Console</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --border: #dce0e8;
    --text: #1a2030;
    --text-dim: #5b6472;
    --accent: #2e8b7e;
    --accent-strong: #1f6b60;
    --accent-soft: rgba(46, 139, 126, 0.12);
    --danger: #c43e3e;
    --danger-soft: rgba(196, 62, 62, 0.1);
    --warning: #b9791e;
    --warning-soft: rgba(185, 121, 30, 0.12);
    --safe: #2e8b57;
    --safe-soft: rgba(46, 139, 87, 0.1);
    --info: #4a62c4;
    --info-soft: rgba(74, 98, 196, 0.1);
    --shadow: 0 1px 2px rgba(20, 24, 34, 0.05), 0 10px 28px rgba(20, 24, 34, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e121b;
      --surface: #161b27;
      --surface-2: #1e2531;
      --border: #2a3242;
      --text: #e8eaf0;
      --text-dim: #9aa3b5;
      --accent: #4fb8ac;
      --accent-strong: #6fd0c4;
      --accent-soft: rgba(79, 184, 172, 0.16);
      --danger: #e15252;
      --danger-soft: rgba(225, 82, 82, 0.16);
      --warning: #e0a23e;
      --warning-soft: rgba(224, 162, 62, 0.16);
      --safe: #4fae6d;
      --safe-soft: rgba(79, 174, 109, 0.16);
      --info: #6c86e8;
      --info-soft: rgba(108, 134, 232, 0.16);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 34px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e121b;
    --surface: #161b27;
    --surface-2: #1e2531;
    --border: #2a3242;
    --text: #e8eaf0;
    --text-dim: #9aa3b5;
    --accent: #4fb8ac;
    --accent-strong: #6fd0c4;
    --accent-soft: rgba(79, 184, 172, 0.16);
    --danger: #e15252;
    --danger-soft: rgba(225, 82, 82, 0.16);
    --warning: #e0a23e;
    --warning-soft: rgba(224, 162, 62, 0.16);
    --safe: #4fae6d;
    --safe-soft: rgba(79, 174, 109, 0.16);
    --info: #6c86e8;
    --info-soft: rgba(108, 134, 232, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 34px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Sora", "IBM Plex Sans", sans-serif; }

  a { color: inherit; }
  button { font-family: inherit; }

  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(155deg, var(--accent), var(--accent-strong));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-family: "Sora", sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 0.02em; }

  .demo-tag {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 8px;
    text-align: center;
  }

  .sidebar-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 0 4px;
  }
  .case-list { display: flex; flex-direction: column; gap: 8px; }
  .case-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .case-item:hover { background: var(--surface-2); }
  .case-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .case-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .case-item-text { min-width: 0; flex: 1; }
  .case-item-title { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case-item-meta { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .case-item-score { font-size: 12px; font-weight: 600; flex-shrink: 0; }

  .sidebar-footer { margin-top: auto; font-size: 11px; color: var(--text-dim); padding: 0 4px; }

  /* ---------- Main ---------- */
  .main { padding: 20px 28px 40px; max-width: 1240px; }

  .topbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    margin-bottom: 20px;
  }
  .topbar-left { min-width: 0; }
  .case-heading { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .case-heading h1 { font-family: "Sora", sans-serif; font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; }
  .platform-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-dim); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px;
  }
  .case-facts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .fact { font-size: 11.5px; color: var(--text-dim); }
  .fact b { color: var(--text); font-weight: 600; }
  .actions-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    font-size: 12px; font-weight: 600; padding: 8px 13px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06231f; }
  .btn.primary:hover { color: #06231f; filter: brightness(1.05); }

  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .gauge-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  .verdict-col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .verdict-pill {
    font-family: "Sora", sans-serif; font-weight: 700; font-size: 13px;
    padding: 7px 14px; border-radius: 999px; letter-spacing: 0.02em;
  }
  .confidence-line { font-size: 11.5px; color: var(--text-dim); text-align: right; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 4px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text-dim);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent-strong); border-bottom-color: var(--accent); }

  .grid-2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 980px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .card h2 {
    font-family: "Sora", sans-serif; font-size: 14.5px; font-weight: 700; margin: 0 0 4px;
  }
  .card .card-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }

  .stripe-card { border-left: 4px solid var(--border); }
  .stripe-danger { border-left-color: var(--danger); }
  .stripe-warning { border-left-color: var(--warning); }
  .stripe-safe { border-left-color: var(--safe); }
  .stripe-info { border-left-color: var(--info); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .chip-danger { background: var(--danger-soft); color: var(--danger); }
  .chip-warning { background: var(--warning-soft); color: var(--warning); }
  .chip-safe { background: var(--safe-soft); color: var(--safe); }
  .chip-info { background: var(--info-soft); color: var(--info); }
  .chip-neutral { background: var(--surface-2); color: var(--text-dim); }

  /* module score bars */
  .score-row { display: grid; grid-template-columns: 168px 1fr 46px; gap: 12px; align-items: center; padding: 9px 0; }
  .score-row + .score-row { border-top: 1px solid var(--border); }
  .score-name { font-size: 12.5px; font-weight: 600; }
  .score-name span { display: block; font-size: 10.5px; font-weight: 400; color: var(--text-dim); margin-top: 1px; }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }
  .score-num { font-size: 12.5px; text-align: right; font-weight: 600; }

  /* reasons list */
  .reason-list { display: flex; flex-direction: column; gap: 10px; }
  .reason {
    display: grid; grid-template-columns: 22px 1fr; gap: 10px;
    padding: 10px 12px; border-radius: 10px; background: var(--surface-2);
  }
  .reason-icon {
    width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .reason-text { font-size: 12.8px; }
  .reason-text b { font-weight: 600; }

  /* deepfake tab */
  .modality-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .modality-badge {
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
  }
  .modality-badge.on { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .modality-badge.off { opacity: 0.5; }

  .face-diagram { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 12px 0 6px; }
  .face-box { text-align: center; }
  .face-box svg { display: block; margin: 0 auto 8px; }
  .face-box-label { font-size: 11px; color: var(--text-dim); }
  .similarity-arrow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .similarity-num { font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 600; }

  .artifact-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .artifact-list li { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; }
  .artifact-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); margin-top: 6px; flex-shrink: 0; }

  /* content tab */
  .transcript-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; font-size: 13.2px; line-height: 1.8;
  }
  mark { border-radius: 4px; padding: 1px 3px; font-weight: 600; box-decoration-break: clone; }
  mark.m-return { background: var(--danger-soft); color: var(--danger); }
  mark.m-urgency { background: var(--warning-soft); color: var(--warning); }
  mark.m-fomo { background: var(--info-soft); color: var(--info); }
  mark.m-authority { background: rgba(150,110,220,0.16); color: #8a5fd6; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  /* link tab */
  .kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; }
  .kv { display: flex; flex-direction: column; gap: 2px; }
  .kv-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
  .kv-value { font-size: 13px; font-weight: 600; }
  .redirect-flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; overflow-x: auto; padding-bottom: 4px; }
  .redirect-chip { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border); padding: 6px 10px; border-radius: 7px; white-space: nowrap; }
  .redirect-arrow { color: var(--text-dim); flex-shrink: 0; }

  /* network tab */
  .network-wrap { display: grid; grid-template-columns: 1fr 260px; gap: 16px; }
  @media (max-width: 980px) { .network-wrap { grid-template-columns: 1fr; } }
  .network-svg-holder { background: var(--surface-2); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
  .node-detail { min-height: 100%; }
  .node-detail-empty { color: var(--text-dim); font-size: 12.5px; padding: 8px 0; }
  .net-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .net-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .net-legend-swatch { width: 10px; height: 10px; border-radius: 50%; }

  /* timeline tab */
  .timeline-chart-holder { background: var(--surface-2); border-radius: 12px; border: 1px solid var(--border); padding: 10px 6px; }
  .event-log { list-style: none; margin: 16px 0 0; padding: 0; position: relative; }
  .event-log li { display: grid; grid-template-columns: 96px 20px 1fr; gap: 10px; padding-bottom: 16px; position: relative; }
  .event-log li:last-child { padding-bottom: 0; }
  .event-date { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-dim); padding-top: 1px; }
  .event-dot-col { display: flex; flex-direction: column; align-items: center; }
  .event-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 4px; flex-shrink: 0; }
  .event-line { flex: 1; width: 1px; background: var(--border); margin-top: 4px; }
  .event-text { font-size: 12.8px; padding-top: 1px; }
  .event-platform { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }

  .platform-bars { display: flex; align-items: flex-end; gap: 18px; height: 120px; padding: 8px 4px 0; }
  .platform-bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; flex: 1; height: 100%; }
  .platform-bar { width: 100%; max-width: 46px; border-radius: 6px 6px 3px 3px; background: var(--accent); }
  .platform-bar-label { font-size: 10.5px; color: var(--text-dim); text-align: center; }
  .platform-bar-num { font-size: 11.5px; font-weight: 600; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 600;
    padding: 10px 18px; border-radius: 9px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    z-index: 50; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .empty-state svg { margin-bottom: 10px; opacity: 0.6; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .case-list { flex-direction: row; }
    .case-item { width: auto; }
    .sidebar-footer { display: none; }
    .main { padding: 16px; }
    .topbar { grid-template-columns: 1fr; }
    .topbar-right { justify-content: space-between; }
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L20 5.5V11C20 16.2 16.6 20.5 12 22C7.4 20.5 4 16.2 4 11V5.5L12 2Z" fill="#06231f"/>

  <main class="main">

</div>

<script>
const ICONS = {
  telegram: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 4L2.5 11.3c-1 .4-1 1.6.1 1.9l4.6 1.5 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.8 4.9 3.6c.8.6 2 .2 2.2-.8L23 5.2c.3-1-.7-1.7-1.6-1.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',

  youtube: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="3" stroke="currentColor" stroke-width="1.4"/><path d="M11 10l4 2-4 2z" fill="currentColor"/></svg>',
  instagram: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4.5" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.4"/></svg>',
};

/* ---------------------------------------------------------------- DATA */
const CASES = [
{
  id: "case-a",
  title: "“300% Guaranteed Returns” video — Apex Wealth Signals",
  platform: "youtube",
  platformLabel: "YouTube → Telegram → WhatsApp",
  submittedType: "Video (2m 41s) + forwarded text",
  submittedBy: "Reported by 3 users, auto-crawled from 1 public channel",
  analyzedAt: "2026-08-24 · 21:12 IST",
  verdict: "FRAUDULENT",
  riskScore: 92,
  confidence: 96,
  scores: {
    deepfake: 88,
    impersonation: 95,
    content: 90,
    link: 84,
    network: 97,
    sebiMismatch: 100
  },
  reasons: [
    { sev: "critical", html: "Face and voice in the video do not match any verified appearance of the person named — <b>synthetic lip-sync artifacts</b> detected around the mouth region in 34% of sampled frames." },

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function bandColor(score, invert){
  const s = invert ? 100 - score : score;
  if (s >= 70) return "danger";
  if (s >= 35) return "warning";
  return "safe";
}
function getCase(id){ return CASES.find(c => c.id === id); }

/* ---------------------------------------------------------------- SIDEBAR */
function renderSidebar(){
  const list = document.getElementById("caseList");
  list.innerHTML = CASES.map(c => {
    const meta = VERDICT_META[c.verdict];
    const active = c.id === STATE.caseId ? "active" : "";
    return `<button class="case-item ${active}" data-case="${c.id}">
      <span class="case-dot" style="background:var(--${meta.color})"></span>
      <span class="case-item-text">
        <span class="case-item-title">${esc(c.title)}</span>

      </span>

  }).join("");
  list.querySelectorAll("[data-case]").forEach(btn => {
    btn.addEventListener("click", () => { STATE.caseId = btn.dataset.case; renderAll(); });
  });
}

/* ---------------------------------------------------------------- TOPBAR */
function drawGauge(score, colorVar){
  const svg = document.getElementById("gaugeSvg");
  const r = 42, cx = 52, cy = 52;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - score / 100);
  const track = cssVar("--surface-2") || "#eceef3";
  const color = cssVar(colorVar);
  svg.innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="600" fill="${cssVar('--text')}">${score}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="${cssVar('--text-dim')}">/ 100</text>
  `;
}

function renderTopbar(c){
  const meta = VERDICT_META[c.verdict];
  document.getElementById("caseTitle").textContent = c.title;
  document.getElementById("casePlatform").innerHTML = `${ICONS[c.platform] || ""} ${esc(c.platformLabel)}`;
  document.getElementById("caseFacts").innerHTML = `
    <span class="fact">Submitted content: <b>${esc(c.submittedType)}</b></span>
    <span class="fact">Source: <b>${esc(c.submittedBy)}</b></span>
    <span class="fact">Analyzed: <b>${esc(c.analyzedAt)}</b></span>
  `;

  pill.style.background = `var(--${meta.color}-soft)`;
  pill.style.color = `var(--${meta.color})`;
  document.getElementById("confidenceLine").innerHTML = `Model confidence <b class="mono">${c.confidence}%</b>`;
  drawGauge(c.riskScore, `--${meta.color}`);
}

    ["Urgency score", ct.urgencyScore]
  ];
  return `<div class="grid-2">
    <div class="card">
      <h2>Flagged transcript</h2>
      <div class="card-sub">Language: ${esc(ct.language)}</div>
      <div class="transcript-box">${segHtml}</div>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--danger)"></span>Guaranteed return</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--warning)"></span>Urgency</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--info)"></span>FOMO</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#8a5fd6"></span>Authority claim</span>
      </div>
    </div>
    <div class="card">
      <h2>Language risk signals</h2>
      <div class="card-sub">Sentiment: ${esc(ct.sentiment)}</div>
      ${bars.map(([label,val]) => `<div class="score-row" style="grid-template-columns:1fr 46px;">
        <div class="score-name">${label}</div>
        <div class="score-num mono" style="color:var(--${bandColor(val)})">${val}</div>
      </div>
      <div class="bar-track" style="margin-top:-4px;margin-bottom:6px;"><div class="bar-fill" style="width:${val}%;background:var(--${bandColor(val)})"></div></div>`).join("")}
    </div>
  </div>`;
}

      <div class="kv"><span class="kv-label">Primary URL</span><span class="kv-value mono" style="font-size:12px;">${esc(l.url)}</span></div>
      <div class="kv"><span class="kv-label">Domain age</span><span class="kv-value mono">${l.domainAgeDays} days</span></div>
      <div class="kv"><span class="kv-label">Registrar</span><span class="kv-value">${esc(l.registrar)}</span></div>
      <div class="kv"><span class="kv-label">Registrant location</span><span class="kv-value">${esc(l.country)}</span></div>
      <div class="kv"><span class="kv-label">WHOIS privacy</span><span class="kv-value">${l.whoisPrivacy ? '<span class="chip chip-warning">Enabled</span>' : '<span class="chip chip-safe">Disabled</span>'}</span></div>
      <div class="kv"><span class="kv-label">SSL certificate</span><span class="kv-value">${l.sslValid ? '<span class="chip chip-safe">Valid</span>' : '<span class="chip chip-danger">Invalid</span>'} <span style="color:var(--text-dim);font-size:11.5px;">${esc(l.sslIssuer)}</span></span></div>
      <div class="kv"><span class="kv-label">Threat-intel blacklist hits</span><span class="kv-value mono" style="color:var(--${l.blacklistHits>0?'danger':'safe'})">${l.blacklistHits}</span></div>

    <h2>Redirect chain</h2>
    <div class="redirect-flow">
      ${l.redirect.map((u,idx) => `${idx>0?'<span class="redirect-arrow">→</span>':''}<span class="redirect-chip">${esc(u)}</span>`).join("")}

/* ---------------------------------------------------------------- NETWORK */
const NODE_COLORS = {
  telegram: "info", whatsapp: "safe", website: "warning", upi: "danger",
  phone: "warning", youtube: "danger", instagram: "warning", bank: "danger", victim: "danger"
};
function renderNetwork(c){
  const n = c.network;
  if (!n.nodes.length){
    return `<div class="card">
      <div class="empty-state">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/><path d="M9 10l3 3 3-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:var(--text);margin-bottom:4px;">No connected scam network detected</div>
        <div>This submission has zero overlap with Telegram/WhatsApp groups, domains, or payment IDs in any known scam cluster.</div>
      </div>
    </div>`;
  }
  const edgesSvg = n.edges.map(([a,b]) => {
    const na = n.nodes.find(x=>x.id===a), nb = n.nodes.find(x=>x.id===b);
    return `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="var(--border)" stroke-width="1.6"/>`;
  }).join("");
  const nodesSvg = n.nodes.map(nd => {
    const color = `var(--${NODE_COLORS[nd.type]||'info'})`;
    return `<g data-node="${nd.id}" style="cursor:pointer;" class="net-node">
      <circle cx="${nd.x}" cy="${nd.y}" r="${nd.r}" fill="${color}" fill-opacity="0.18" stroke="${color}" stroke-width="2"/>
      <text x="${nd.x}" y="${nd.y + nd.r + 14}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="var(--text-dim)">${esc(nd.label.length>18?nd.label.slice(0,17)+'…':nd.label)}</text>
    </g>`;
  }).join("");
  const legendTypes = [...new Set(n.nodes.map(x=>x.type))];
  return `<div class="card">
    <h2>Connected scam network</h2>
    <div class="card-sub">${n.clusterSize} connected entities. ${n.knownCluster ? `Matches a known cluster seen in <b>${n.priorCases}</b> prior MarketShield cases.` : "No overlap with a previously known cluster."}</div>
    <div class="network-wrap">
      <div class="network-svg-holder">
        <svg id="netSvg" viewBox="0 0 640 380" width="100%" height="360">${edgesSvg}${nodesSvg}</svg>
      </div>
      <div class="card" style="box-shadow:none;">
        <h2 style="font-size:13px;">Entity detail</h2>
        <div class="node-detail" id="nodeDetail"><div class="node-detail-empty">Click a node to inspect it.</div></div>
      </div>
    </div>
    <div class="net-legend">
      ${legendTypes.map(t => `<span class="net-legend-item"><span class="net-legend-swatch" style="background:var(--${NODE_COLORS[t]||'info'})"></span>${t}</span>`).join("")}
    </div>
  </div>`;
}
function wireNetworkClicks(c){
  document.querySelectorAll(".net-node").forEach(g => {
    g.addEventListener("click", () => {
      const node = c.network.nodes.find(n => n.id === g.dataset.node);
      const detail = document.getElementById("nodeDetail");
      if (!node || !detail) return;
      const color = `var(--${NODE_COLORS[node.type]||'info'})`;
      detail.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="width:10px;height:10px;border-radius:50%;background:${color};"></span>
          <b>${esc(node.label)}</b>
        </div>
        <div class="kv" style="margin-bottom:8px;"><span class="kv-label">Entity type</span><span class="kv-value" style="text-transform:capitalize;">${node.type}</span></div>
        <div class="kv"><span class="kv-label">Risk level</span><span class="kv-value" style="color:${color};text-transform:capitalize;">${node.risk}</span></div>
      `;
    });
  });
}

/* ---------------------------------------------------------------- TIMELINE */
function timelinePath(points){
  if (points.length < 2) return { area:"", line:"", last:points[points.length-1] || [0,0], maxY:1, maxX:1 };
  const maxX = points[points.length-1][0] || 1;
  const maxY = Math.max(...points.map(p=>p[1]), 1);
  const W = 560, H = 140, PAD = 10;
  const sx = x => PAD + (x / maxX) * (W - PAD*2);
  const sy = y => H - PAD - (y / maxY) * (H - PAD*2);
  const line = points.map((p,i) => `${i===0?'M':'L'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");
  const area = line + ` L${sx(points[points.length-1][0]).toFixed(1)},${H-PAD} L${sx(points[0][0]).toFixed(1)},${H-PAD} Z`;
  const last = points[points.length-1];
  return { area, line, last: [sx(last[0]), sy(last[1])], W, H, maxY };
}
function renderTimeline(c){
  const tl = c.timeline;
  const { area, line, last, W, H } = timelinePath(tl.points);
  const gridLines = [0,0.25,0.5,0.75,1].map(f => `<line x1="0" y1="${(H||140)*f}" x2="${W||560}" y2="${(H||140)*f}" stroke="var(--border)" stroke-width="1"/>`).join("");
  const accent = cssVar("--accent");
  const platforms = Object.entries(tl.platformCounts);
  const maxP = Math.max(...platforms.map(p=>p[1]), 1);
  return `<div class="grid-2">
    <div class="card">
      <h2>Victim report growth over time</h2>
      <div class="card-sub">Cumulative reports linked to this content since first detection.</div>
      <div class="timeline-chart-holder">
        <svg viewBox="0 0 ${W||560} ${H||140}" width="100%" height="140">
          ${gridLines}
          ${tl.points.length>1 ? `<path d="${area}" fill="${accent}" fill-opacity="0.14" stroke="none"/><path d="${line}" fill="none" stroke="${accent}" stroke-width="2.2"/>` : ''}
          ${tl.points.length>1 ? `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${accent}"/>` : ''}
        </svg>
      </div>
      <h2 style="margin-top:18px;">Event log</h2>
      <ul class="event-log">
        ${tl.events.map((e,idx) => `<li>
          <span class="event-date">${esc(e.date)}</span>
          <span class="event-dot-col"><span class="event-dot"></span>${idx<tl.events.length-1?'<span class="event-line"></span>':''}</span>
          <span><span class="event-text">${esc(e.text)}</span><div class="event-platform">${esc(e.platform)}</div></span>
        </li>`).join("")}
      </ul>
    </div>
    <div class="card">
      <h2>Spread by platform</h2>
      <div class="card-sub">Where this content (or its variants) has been seen.</div>
      <div class="platform-bars">
        ${platforms.map(([name,val]) => `<div class="platform-bar-col">
          <span class="platform-bar-num mono">${val}</span>
          <div class="platform-bar" style="height:${Math.max((val/maxP)*100,4)}%;"></div>
          <span class="platform-bar-label">${esc(name)}</span>
        </div>`).join("")}
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- ROUTER */
function renderTabPanel(c){
  const panel = document.getElementById("tabPanel");
  let html = "";
  switch(STATE.tab){
    case "overview": html = renderOverview(c); break;
    case "deepfake": html = renderDeepfake(c); break;
    case "identity": html = renderIdentity(c); break;
    case "content": html = renderContent(c); break;
    case "link": html = renderLink(c); break;
    case "network": html = renderNetwork(c); break;
    case "timeline": html = renderTimeline(c); break;
  }
  panel.innerHTML = html;
  if (STATE.tab === "network") wireNetworkClicks(c);
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function wireActions(){
  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const msgs = {
        report: "Demo action — wire this to your SEBI SCORES / Cyber Cell reporting API.",
        export: "Demo action — wire this to a PDF evidence-report generator.",
        restrict: "Demo action — wire this to your platform take-down / blocklist workflow."
      };
      showToast(msgs[btn.dataset.action] || "Demo action");
    });
  });
}

function renderAll(){
  const c = getCase(STATE.caseId);
  renderSidebar();
  renderTopbar(c);
  renderTabs();
  renderTabPanel(c);
  wireActions();
}

renderAll();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderAll());
</script>
